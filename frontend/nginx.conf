# Статика SPA и прокси к API (сервис api в docker-compose.yml).

upstream polymeet_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # X-Real-IP — по нему API считает лимит неудачных попыток входа
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API, документация (/api/docs) и спецификация (/api/openapi.json)
    location /api/ {
        proxy_pass http://polymeet_api;
    }

    location = /health {
        proxy_pass http://polymeet_api;
    }

    location = /health/ready {
        proxy_pass http://polymeet_api;
    }

    # Метрики только для внутренней сети
    location /metrics {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
