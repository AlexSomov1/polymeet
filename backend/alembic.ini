# URL базы здесь не хранится: migrations/env.py берёт его из Settings (DATABASE_URL).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Идентификаторы ревизий задаются вручную: alembic revision --rev-id 0004 -m "..."
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
