[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymeet-backend"
version = "0.1.0"
description = "PolyMeet API: встречи студентов с геопривязкой"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.143.0",
    "uvicorn[standard]~=0.54.0",
    "gunicorn~=26.2",
    "pydantic~=2.14",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.1",
    "asyncpg~=0.32.0",
    "alembic~=1.20",
    # arq 0.28 требует redis < 6
    "redis~=5.3",
    "arq~=0.28.0",
    "httpx~=0.28.1",
    "argon2-cffi~=25.1",
    "pyjwt~=2.15",
    "python-ulid~=4.0",
    "structlog~=26.1",
    "prometheus-fastapi-instrumentator~=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "asgi-lifespan~=2.1",
    # 4.14+ требует redis >= 8, несовместимо с arq
    "testcontainers[postgres,redis]~=4.13.3",
    "fakeredis~=2.39",
    "respx~=0.23.1",
    "ruff~=0.17.0",
    "mypy~=2.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
exclude = ["^\\.venv/", "^build/"]

# Аналог --strict для слоёв services и core (strict нельзя задать для отдельных модулей)
[[tool.mypy.overrides]]
module = ["app.core.*", "app.services.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# testcontainers 4.13 сам использует свой устаревший декоратор ожидания
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.coverage.run]
source = ["app"]
branch = true
